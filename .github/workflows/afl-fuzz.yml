name: AFL++ Fuzzing

on:
  push:
    branches: [ master, main ]
    paths-ignore: ['.github/**']
  pull_request:
    branches: [ master, main ]
    paths-ignore: ['.github/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: write

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # create = server side request parsing (CreateResponseV4/V6)
        # decrypt = client side response parsing (DecryptResponseV4/V6)
        mode: [ create, decrypt ]
    env:
      MODE: ${{ matrix.mode }}
      CFLAGS: -std=gnu11 -O1 -g -DNO_LOG -DNO_VERBOSE_LOG -DNO_EXTERNAL_DATA -DUNSAFE_DATA_LOAD -I../src
      SAN: -fsanitize=address,undefined -fno-sanitize=shift -fno-sanitize-recover=undefined
    steps:
      - uses: actions/checkout@v4

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends afl++ clang
          command -v afl-fuzz
          command -v afl-clang-fast || command -v afl-gcc || true

      - name: Detect fuzzer compiler
        id: aflcc
        run: |
          if command -v afl-clang-fast >/dev/null; then echo "CC=afl-clang-fast"; else echo "CC=afl-gcc"; fi >> "$GITHUB_ENV"

      - name: Build seed generator
        run: |
          gcc $CFLAGS $SAN -o make-seeds \
            ../src/kms.c ../src/crypto.c ../src/crypto_internal.c ../src/endian.c \
            ../src/output.c ../src/shared_globals.c ../src/helpers.c ../src/kmsdata.c \
            make-seeds.c
        working-directory: fuzzing

      - name: Generate seed corpus
        run: |
          rm -rf seeds && mkdir -p seeds
          ./make-seeds seeds
          # Korpus is protocol-shaped per target: requests for the create
          # parser, responses for the decrypt parser. Feeding a response to
          # the request parser (and vice versa) makes the initial dry run
          # crash, which afl-fuzz treats as "no valid seed" and aborts.
          if [ "$MODE" = "decrypt" ]; then
            rm -f seeds/req6.bin seeds/req4.bin seeds/zero6.bin
          else
            rm -f seeds/resp6.bin seeds/resp4.bin
          fi
        working-directory: fuzzing

      - name: Build fuzz target
        run: |
          SRCS="kms.c crypto.c crypto_internal.c endian.c output.c shared_globals.c helpers.c kmsdata.c"
          rm -f *.o
          for src in $SRCS; do $CC $CFLAGS $SAN -c ../src/$src -o obj-$src.o || exit 1; done
          $CC $CFLAGS $SAN -c afl-harness.c -o afl-harness.o || exit 1
          $CC $SAN obj-*.o afl-harness.o -o harness-$MODE || exit 1

          # The AFL++ clang build traps on UBSAN reports without printing a
          # trace to stderr, so crashes of that class cannot be symbolized
          # from the instrumented binary alone. Rebuild the same harness with
          # gcc: its ASAN/UBSAN runtime prints symbolizable reports that the
          # crash-to-SARIF converter parses.
          rm -f obj-*.o
          for src in $SRCS; do gcc $CFLAGS $SAN -c ../src/$src -o obj-$src.o || exit 1; done
          gcc $CFLAGS $SAN -c afl-harness.c -o afl-harness.o || exit 1
          gcc $SAN obj-*.o afl-harness.o -o replay-$MODE || exit 1
          file harness-$MODE replay-$MODE
        working-directory: fuzzing

      - name: Smoke test
        run: |
          # sanity: the harness must start and reach the parsers. Seeds that
          # trigger known ASAN findings legitimately crash - that is the point
          # of the fuzzing run, so their exit code is reported, not fatal here.
          set +e
          for seed in seeds/*.bin; do
            ./harness-$MODE "$MODE" "$seed" >/dev/null 2>smoke-$MODE.log
            echo "seed $(basename "$seed") exit=$?"
          done
          head -5 smoke-$MODE.log
          exit 0
        working-directory: fuzzing

      - name: Fuzz
        timeout-minutes: 10
        env:
          AFL_NO_UI: 1
          AFL_SKIP_CPUFREQ: 1
          AFL_NO_AFFINITY: 1
          AFL_BENCH_UNTIL_CRASH: 1
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
          ASAN_OPTIONS: abort_on_error=1:symbolize=0:detect_leaks=0
        run: |
          rm -rf out
          timeout 480s afl-fuzz -i seeds -o out -m none -t 2000 -- ./harness-$MODE "$MODE" @@ </dev/null || true
          echo "--- fuzzer_stats ---"
          cat out/default/fuzzer_stats 2>/dev/null || true
        working-directory: fuzzing

      - name: Convert crashes to SARIF
        if: always()
        run: |
          python3 crashes-to-sarif.py \
            --harness ./replay-$MODE \
            --mode "$MODE" \
            --crashes out/default/crashes \
            --output ../afl-results-$MODE.sarif
        working-directory: fuzzing

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: afl-results-${{ matrix.mode }}.sarif
          category: afl-${{ matrix.mode }}

      - name: Package artifacts
        if: always()
        run: tar czf ../afl-${{ matrix.mode }}.tar.gz out || true
        working-directory: fuzzing

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afl-${{ matrix.mode }}
          path: afl-${{ matrix.mode }}.tar.gz
          if-no-files-found: warn

      - name: Fail on crashes
        run: |
          count=$(find out -path '*/crashes/id:*' 2>/dev/null | wc -l)
          echo "AFL++ $MODE target found $count crash(es)"
          if [ "$count" != "0" ]; then exit 1; fi
        working-directory: fuzzing