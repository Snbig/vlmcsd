name: AFL++ Fuzzing

on:
  push:
    branches: [ master, main ]
    paths-ignore: ['.github/**']
  pull_request:
    branches: [ master, main ]
    paths-ignore: ['.github/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: write

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # create = server side request parsing (CreateResponseV4/V6)
        # decrypt = client side response parsing (DecryptResponseV4/V6)
        mode: [ create, decrypt ]
    env:
      MODE: ${{ matrix.mode }}
      CFLAGS: -std=gnu11 -O1 -g -DNO_LOG -DNO_VERBOSE_LOG -DNO_EXTERNAL_DATA -DUNSAFE_DATA_LOAD -I../src
      SAN: -fsanitize=address,undefined -fno-sanitize=shift -fno-sanitize-recover=undefined
    steps:
      - uses: actions/checkout@v4

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends afl++ clang
          command -v afl-fuzz
          command -v afl-clang-fast || command -v afl-gcc || true

      - name: Detect fuzzer compiler
        id: aflcc
        run: |
          if command -v afl-clang-fast >/dev/null; then echo "CC=afl-clang-fast"; else echo "CC=afl-gcc"; fi >> "$GITHUB_ENV"

      - name: Build seed generator
        run: |
          gcc $CFLAGS $SAN -o make-seeds \
            ../src/kms.c ../src/crypto.c ../src/crypto_internal.c ../src/endian.c \
            ../src/output.c ../src/shared_globals.c ../src/helpers.c ../src/kmsdata.c \
            make-seeds.c
        working-directory: fuzzing

      - name: Generate seed corpus
        run: |
          rm -rf seeds && mkdir -p seeds
          ./make-seeds seeds
          # Korpus is protocol-shaped per target: requests for the create
          # parser, responses for the decrypt parser. Feeding a response to
          # the request parser (and vice versa) makes the initial dry run
          # crash, which afl-fuzz treats as "no valid seed" and aborts.
          if [ "$MODE" = "decrypt" ]; then
            rm -f seeds/req6.bin seeds/req4.bin seeds/zero6.bin
          else
            rm -f seeds/resp6.bin seeds/resp4.bin
          fi
        working-directory: fuzzing

      - name: Build fuzz target
        run: |
          SRCS="kms.c crypto.c crypto_internal.c endian.c output.c shared_globals.c helpers.c kmsdata.c"
          rm -f *.o
          for src in $SRCS; do $CC $CFLAGS $SAN -c ../src/$src -o obj-$src.o || exit 1; done
          $CC $CFLAGS $SAN -c afl-harness.c -o afl-harness.o || exit 1
          $CC $SAN obj-*.o afl-harness.o -o harness-$MODE || exit 1

          # The AFL++ clang build traps on UBSAN reports without printing a
          # trace to stderr, so crashes of that class cannot be symbolized
          # from the instrumented binary alone. Rebuild the same harness with
          # gcc: its ASAN/UBSAN runtime prints symbolizable reports that the
          # crash-to-SARIF converter parses.
          rm -f obj-*.o
          for src in $SRCS; do gcc $CFLAGS $SAN -c ../src/$src -o obj-$src.o || exit 1; done
          gcc $CFLAGS $SAN -c afl-harness.c -o afl-harness.o || exit 1
          gcc $SAN obj-*.o afl-harness.o -o replay-$MODE || exit 1
          file harness-$MODE replay-$MODE
        working-directory: fuzzing

      - name: Smoke test
        run: |
          # sanity: the harness must start and reach the parsers. Seeds that
          # trigger known ASAN findings legitimately crash - that is the point
          # of the fuzzing run, so their exit code is reported, not fatal here.
          set +e
          for seed in seeds/*.bin; do
            ./harness-$MODE "$MODE" "$seed" >/dev/null 2>smoke-$MODE.log
            echo "seed $(basename "$seed") exit=$?"
          done
          head -5 smoke-$MODE.log
          exit 0
        working-directory: fuzzing

      - name: Replay regression crashes
        if: always() && hashFiles('fuzzing/regression-crashes/*.bin') != ''
        run: |
          mkdir -p all-crashes
          python3 crashes-to-sarif.py \
            --harness ./replay-$MODE \
            --mode "$MODE" \
            --crashes regression-crashes \
            --output ../afl-results-regression-$MODE.sarif || true
        working-directory: fuzzing

      - name: Fuzz
        timeout-minutes: 20
        env:
          AFL_NO_UI: 1
          AFL_SKIP_CPUFREQ: 1
          AFL_NO_AFFINITY: 1
          AFL_BENCH_UNTIL_CRASH: 1
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
          ASAN_OPTIONS: abort_on_error=1:symbolize=0:detect_leaks=0
        run: |
          rm -rf out
          CORES=$(nproc 2>/dev/null || echo 1)
          # Run the primary instance as the main exploration worker; spawn
          # secondary instances on remaining cores to diversify coverage.
          # Each secondary synchronizes automatically with the main output
          # directory and contributes independent coverage paths.
          DICT_ARG=""
          if [ -f kms.dict ]; then DICT_ARG="-x kms.dict"; fi
          # Run all instances under an inner time budget (matching the step
          # timeout). AFL_BENCH_UNTIL_CRASH keeps an instance alive until it
          # finds a crash; the inner loop exits early when that happens. When
          # the budget expires instead, timeout(1) signals the shell, we clean
          # up the instances and the step continues (the fail-on-crashes step
          # below is what gates the job).
          timeout 1080s bash -c '
            ALL_PIDS=""
            afl-fuzz -i seeds -o out -M main -m none -t 2000 '"$DICT_ARG"' -- ./harness-'"$MODE"' '"$MODE"' @@ </dev/null &
            ALL_PIDS="$!"
            for i in $(seq 2 '"$CORES"'); do
              afl-fuzz -i seeds -o out -S sec$i -m none -t 2000 '"$DICT_ARG"' -- ./harness-'"$MODE"' '"$MODE"' @@ </dev/null &
              ALL_PIDS="$ALL_PIDS $!"
            done
            # Wait for any fuzzer instance to find a crash (AFL_BENCH_UNTIL_CRASH
            # stops that instance); once any PID exits, SIGINT the rest.
            while true; do
              for p in $ALL_PIDS; do
                if ! kill -0 $p 2>/dev/null; then
                  for q in $ALL_PIDS; do kill -INT $q 2>/dev/null || true; done
                  wait 2>/dev/null || true
                  exit 0
                fi
              done
              sleep 1
            done
          '
          RAFT_STATUS=$?
          echo "Fuzz budget status=$RAFT_STATUS (124 = time budget expired without crash)"
          pkill -INT -f 'afl-fuzz' 2>/dev/null || true
          sleep 1
          pkill -KILL -f 'afl-fuzz' 2>/dev/null || true
          wait 2>/dev/null || true

          # Collect all crashes from every instance into a single directory.
          mkdir -p out/default/crashes
          find out -path '*/crashes/id:*' -exec sh -c 'cp "$1" out/default/crashes/$(basename "$1")-$(basename "$(dirname "$(dirname "$1")")")' _ {} \; 2>/dev/null || true

          echo "--- fuzzer_stats (main) ---"
          cat out/main/fuzzer_stats 2>/dev/null || true
          exit 0
        working-directory: fuzzing

      - name: Convert crashes to SARIF
        if: always()
        run: |
          # Merge regression fixtures (already replayed) and live fuzz crashes
          # into one directory, then produce a single SARIF per mode. The
          # converter deduplicates by (artifact_path, line) internally.
          mkdir -p all-crashes
          cp regression-crashes/*.bin all-crashes/ 2>/dev/null || true
          cp out/default/crashes/id:* all-crashes/ 2>/dev/null || true
          python3 crashes-to-sarif.py \
            --harness ./replay-$MODE \
            --mode "$MODE" \
            --crashes all-crashes \
            --output ../afl-results-$MODE.sarif
        working-directory: fuzzing

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: afl-results-${{ matrix.mode }}.sarif
          category: afl-${{ matrix.mode }}

      - name: Package artifacts
        if: always()
        run: tar czf ../afl-${{ matrix.mode }}.tar.gz out || true
        working-directory: fuzzing

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afl-${{ matrix.mode }}
          path: afl-${{ matrix.mode }}.tar.gz
          if-no-files-found: warn

      - name: Fail on crashes
        run: |
          count=$(find out -path '*/crashes/id:*' 2>/dev/null | wc -l)
          echo "AFL++ $MODE target found $count crash(es)"
          if [ "$count" != "0" ]; then exit 1; fi
        working-directory: fuzzing
