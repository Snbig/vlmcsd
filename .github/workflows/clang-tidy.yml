name: Clang-Tidy Static Analysis

on:
  push:
    branches: [ master, main, release ]
    paths-ignore: ['.github/**']
  pull_request:
    branches: [ master, main, release ]
    paths-ignore: ['.github/**']
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  clang-tidy:
    name: clang-tidy (analyzer/bugprone/cert/security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bear clang clang-tidy

      - name: Generate compile_commands.json
        run: |
          bear intercept --output events.json -- \
            make -j"$(nproc)" allmulti CC=clang CFLAGS="-O0 -g -Wno-error"
          bear citnames --output compile_commands.json --input events.json
          cp compile_commands.json src/

      - name: Run cpp-linter (clang-tidy)
        id: linter
        uses: cpp-linter/cpp-linter-action@v2
        with:
          extensions: 'c,h'
          ignore: 'fuzzing/**'
          tidy-checks: '-*,clang-analyzer-*,bugprone-*,cert-*,security-*,performance-*,portability-*'
          database: 'src/compile_commands.json'
          style: ''
          lines-changed-only: true
          thread-comments: false
          file-annotations: true
          step-summary: true

      - name: Generate SARIF report
        run: |
          # clang-tidy has no native SARIF output and the clang-tidy-sarif
          # PyPI package does not exist, so parse the stable text format with
          # the bundled converter. Same check groups as the cpp-linter step.
          # Files must be passed explicitly: clang-tidy does not auto-analyze
          # the compilation database when no source files are given.
          clang-tidy -p src \
            -checks='-*,clang-analyzer-*,bugprone-*,cert-*,security-*,performance-*,portability-*' \
            $(jq -r '.[].file | select(test("\\.c$"))' src/compile_commands.json) \
            > clang-tidy-output.txt 2>&1 || true
          python3 .github/scripts/clang-tidy-to-sarif.py \
            clang-tidy-output.txt clang-tidy-results.sarif

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clang-tidy-results.sarif
          category: clang-tidy