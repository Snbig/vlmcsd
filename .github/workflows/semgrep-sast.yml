name: Semgrep SAST Analysis

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --exclude .github/workflows --sarif --output=semgrep-results.sarif .
        env:
          SEMGREP_RULES: >-
            p/default
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/r2c-audit
            p/secrets
            p/ci

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
